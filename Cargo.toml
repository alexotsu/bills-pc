[package]
name = "deckgym"
version = "0.1.0"
edition = "2021"
default-run = "deckgym"
description = "A high-performance Rust library for simulating Pokémon TCG Pocket games."

[dependencies]
rand = "0.8"
lazy_static = "1.4"
clap = { version = "4.5.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.22"
env_logger = "0.11.6"
colored = "3"
chrono = "0.4.39"
indexmap = "2.7.0"
num-format = "0.4.4"
humantime = "2.1.0"
uuid = { version = "1.17.0", features = ["v4", "js"] }
indicatif = "0.18.2"
rayon = { version = "1.10", optional = true }
csv = { version = "1.3.1", optional = true }
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
strum = "0.27"
strum_macros = "0.27"
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.28", optional = true }

# rand (via rand_core) pulls in getrandom for OS entropy; on wasm32-unknown-unknown getrandom
# requires the "js" feature to be enabled explicitly by a direct dependent (uuid's own "js"
# feature above only covers uuid's own randomness, not rand's).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["parallel"]
test-utils = []
python = ["pyo3"]
tui = ["ratatui", "crossterm"]
csv-export = ["csv"]
# Bulk/parallel simulation (`simulate`/`optimize` modules) via rayon, which needs native OS
# threads and doesn't compile for wasm32-unknown-unknown. On by default so every existing
# native build/CLI/test invocation is unaffected; the wasm build opts out with
# --no-default-features.
parallel = ["dep:rayon"]

[lib]
name = "deckgym"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }

[[bench]]
name = "play_benchmark"
harness = false

[[bench]]
name = "card_lookup_benchmark"
harness = false

[[bench]]
name = "rare_candy_benchmark"
harness = false

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[bin]]
name = "temp_deck_generator"
path = "src/bin/temp_deck_generator.rs"

[[example]]
name = "sylveon_deck_draw_speed"
required-features = ["csv-export"]
