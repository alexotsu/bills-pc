[package]
name = "engine-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen wrapper around deckgym-core for browser use"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckgym = { path = "../..", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
