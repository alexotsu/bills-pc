# Local development only — these credentials are not for production use.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: deckgym
      POSTGRES_PASSWORD: deckgym_dev_password
      POSTGRES_DB: deckgym
    ports:
      - "5432:5432"
    volumes:
      - deckgym_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deckgym"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  deckgym_postgres_data:
